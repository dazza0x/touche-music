<!DOCTYPE html>
<html lang="en-GB">

<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* admin-only layout on top of the brand variables from styles.css */
  body{display:block;min-height:100dvh;padding-bottom:90px}
  .admin-wrap{max-width:760px;margin:0 auto;padding:0 clamp(16px,5vw,40px)}
  .admin-strap{color:var(--gold) !important}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
    margin:18px 0;
  }
  .panel h2{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:22px;
    color:var(--sage-deep);
    margin-bottom:10px;
  }
  .panel p{font-size:15px;color:var(--ink-soft);margin:8px 0;line-height:1.5}
  label{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 4px}
  input[type=password], input[type=text]{
    width:100%;
    padding:12px 14px;
    font-family:'Jost',sans-serif;
    font-size:16px;
    color:var(--ink);
    background:var(--parchment);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .btn{
    font-family:'Jost',sans-serif;
    font-size:15px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:12px 22px;
    border-radius:999px;
    border:1px solid var(--sage);
    background:var(--sage);
    color:var(--on-sage);
    cursor:pointer;
    min-height:44px;
  }
  .btn.ghost{background:transparent;color:var(--sage-deep);border-color:var(--line)}
  .btn.small{padding:7px 14px;font-size:13px;min-height:36px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .error{color:#a33d2e;font-size:14px;margin-top:10px;min-height:18px}

  /* sticky save bar */
  .savebar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--bar-bg);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px clamp(16px,5vw,40px) calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;justify-content:center;
  }
  .savebar .count{font-size:14px;color:var(--ink-soft);flex:1;max-width:300px}

  /* playlist sections */
  details.pl{border-bottom:1px solid var(--line)}
  details.pl summary{
    list-style:none;cursor:pointer;
    display:flex;align-items:center;gap:12px;
    padding:16px 4px;min-height:56px;
  }
  details.pl summary::-webkit-details-marker{display:none}
  .pl-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;flex:1}
  .pl-count{font-size:13px;color:var(--ink-soft)}
  .song{
    display:flex;align-items:center;gap:10px;
    padding:9px 4px 9px 14px;
    border-top:1px dashed var(--line);
    font-size:15px;
  }
  .song .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .song .t small{color:var(--ink-soft)}
  .song button{
    background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--ink-soft);cursor:pointer;font-family:'Jost',sans-serif;
    font-size:12px;padding:7px 10px;min-height:34px;
  }
  .song button:hover{color:var(--sage-deep);border-color:var(--sage)}
  .section-note{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:10px 4px 2px 14px}

  /* modal */
  .modal-back{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;
  }
  .modal{
    background:var(--parchment);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:480px;max-height:84dvh;overflow-y:auto;padding:22px;
  }
  .modal h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:12px}
  .choice{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:13px 16px;margin:8px 0;font-family:'Jost',sans-serif;font-size:16px;
    color:var(--ink);cursor:pointer;min-height:48px}
  .choice:hover{border-color:var(--sage)}
  .upl-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
  .upl-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upl-row .st{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  progress{width:70px;height:6px;accent-color:var(--sage)}
</style>
</head>
<body>

<header style="position:static">
  <div class="wordmark">Touché</div>
  <div class="strap admin-strap">Music Admin</div>
</header>

<div class="admin-wrap" id="view"></div>
<div id="modalHost"></div>

<script>
/* =====================================================================
   Touché Music Admin
   A serverless console for the music library: move songs between
   genres, rename them, and upload new MP3s. It talks directly to
   GitHub (to edit playlists.js) and to Cloudflare R2 (to store audio)
   using tokens that are held ONLY on this device, encrypted with a
   passphrase. Nothing runs on a server.
   ===================================================================== */

const GH_API   = 'https://api.github.com/repos/dazza0x/touche-music/contents/playlists.js';
const R2_HOST  = '822821b3bbd95ab6b53f8935ab4a2018.r2.cloudflarestorage.com';
const R2_BUCKET = 'touche-music';
const AUDIO_BASE = 'https://audio.touchesm.com/';
const ARTIST = 'Touché Sessions';
const VAULT_KEY = 'touche-admin-vault';

let creds = null;          // {gh, r2id, r2secret} — in memory only while unlocked
let model = null;          // parsed playlists: [{name, tracks:[{title,artist,url}], altBoundary}]
let fileSha = null;        // GitHub blob sha for compare-and-swap saves
let headerText = null;     // the comment block above PLAYLISTS, kept verbatim
let dirty = 0;             // staged change count

const $id = s => document.getElementById(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ===================== vault (passphrase-encrypted tokens) ===================== */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:310000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function sealVault(pass, data){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(data)));
  localStorage.setItem(VAULT_KEY, JSON.stringify({ salt:b64(salt), iv:b64(iv), ct:b64(ct) }));
}
async function openVault(pass){
  const v = JSON.parse(localStorage.getItem(VAULT_KEY));
  const key = await deriveKey(pass, unb64(v.salt));
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(v.iv) }, key, unb64(v.ct));
  return JSON.parse(td.decode(pt));
}

/* ===================== playlists.js parsing & regeneration ===================== */
function parsePlaylists(text){
  const headerEnd = text.indexOf('const PLAYLISTS');
  headerText = text.slice(0, headerEnd);
  const lists = [];
  let cur = null;
  for (const line of text.split('\n')){
    let m;
    if ((m = line.match(/name:\s*"([^"]+)"/))){
      cur = { name:m[1], tracks:[], altBoundary:null };
      lists.push(cur);
    } else if (cur && /\/\*\s*alternate/.test(line)){
      cur.altBoundary = cur.tracks.length;
    } else if (cur && (m = line.match(/title:\s*"([^"]+)".*artist:\s*"([^"]+)".*url:\s*"([^"]+)"/))){
      cur.tracks.push({ title:m[1], artist:m[2], url:m[3] });
    }
  }
  for (const pl of lists) if (pl.altBoundary === null) pl.altBoundary = pl.tracks.length;
  return lists;
}

function regenerate(){
  const out = [headerText + 'const PLAYLISTS = ['];
  model.forEach((pl, i) => {
    out.push('  {');
    out.push(`    name: "${pl.name}",`);
    out.push('    tracks: [');
    out.push('      /* first takes — different tunes before anything repeats */');
    pl.tracks.forEach((t, j) => {
      if (j === pl.altBoundary) out.push('      /* alternate takes and remixes */');
      const comma = j === pl.tracks.length - 1 ? '' : ',';
      out.push(`      { title: "${t.title}", artist: "${t.artist}", url: "${t.url}" }${comma}`);
    });
    out.push('    ]');
    out.push('  }' + (i === model.length - 1 ? '' : ','));
  });
  out.push('];');
  out.push('');
  return out.join('\n');
}

/* a track is an "alternate" if it's a later take, remix or instrumental */
const isAlternate = t => /\((take |remix|instrumental|smashed|again)/i.test(t);

/* ===================== GitHub (read & commit playlists.js) ===================== */
async function ghLoad(){
  const headers = { Accept:'application/vnd.github+json' };
  if (creds && creds.gh) headers.Authorization = 'Bearer ' + creds.gh;
  const res = await fetch(GH_API + '?t=' + Date.now(), { headers });
  if (!res.ok) throw new Error('GitHub read failed (' + res.status + ')');
  const j = await res.json();
  fileSha = j.sha;
  const bytes = unb64(j.content.replace(/\n/g,''));
  return td.decode(bytes);
}
async function ghSave(message){
  const text = regenerate();
  const bytes = te.encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  const res = await fetch(GH_API, {
    method:'PUT',
    headers:{ Accept:'application/vnd.github+json', Authorization:'Bearer ' + creds.gh, 'Content-Type':'application/json' },
    body: JSON.stringify({ message, content: btoa(bin), sha: fileSha })
  });
  if (res.status === 409) throw new Error('conflict');
  if (!res.ok) throw new Error('GitHub save failed (' + res.status + ')');
  fileSha = (await res.json()).content.sha;
}

/* ===================== R2 (signed uploads from the browser) ===================== */
async function hmac(keyBytes, msg){
  const k = await crypto.subtle.importKey('raw', keyBytes, { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, te.encode(msg)));
}
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
async function sha256hex(data){ return hex(await crypto.subtle.digest('SHA-256', data)); }
const EMPTY_HASH = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';

async function signR2(method, key, payloadHash, contentType){
  const now = new Date();
  const amzDate = now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const date = amzDate.slice(0, 8);
  const uri = `/${R2_BUCKET}/${key}`;
  const hdrs = [['host', R2_HOST], ['x-amz-content-sha256', payloadHash], ['x-amz-date', amzDate]];
  if (contentType) hdrs.unshift(['content-type', contentType]);
  const canonHeaders = hdrs.map(h => h[0] + ':' + h[1] + '\n').join('');
  const signedNames = hdrs.map(h => h[0]).join(';');
  const canonical = [method, uri, '', canonHeaders, signedNames, payloadHash].join('\n');
  const scope = `${date}/auto/s3/aws4_request`;
  const toSign = ['AWS4-HMAC-SHA256', amzDate, scope, await sha256hex(te.encode(canonical))].join('\n');
  let k = await hmac(te.encode('AWS4' + creds.r2secret), date);
  k = await hmac(k, 'auto'); k = await hmac(k, 's3'); k = await hmac(k, 'aws4_request');
  const sig = hex(await hmac(k, toSign));
  return {
    url: `https://${R2_HOST}${uri}`,
    headers: {
      'x-amz-content-sha256': payloadHash,
      'x-amz-date': amzDate,
      Authorization: `AWS4-HMAC-SHA256 Credential=${creds.r2id}/${scope}, SignedHeaders=${signedNames}, Signature=${sig}`
    }
  };
}
async function r2Exists(key){
  const s = await signR2('HEAD', key, EMPTY_HASH);
  const res = await fetch(s.url, { method:'HEAD', headers:s.headers });
  return res.ok;
}
function r2Upload(key, file, payloadHash, onProgress){
  return signR2('PUT', key, payloadHash, 'audio/mpeg').then(s => new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', s.url);
    for (const [h, v] of Object.entries(s.headers)) xhr.setRequestHeader(h, v);
    xhr.setRequestHeader('Content-Type', 'audio/mpeg');
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error('upload failed (' + xhr.status + ')'));
    xhr.onerror = () => reject(new Error('upload failed (network/CORS)'));
    xhr.send(file);
  }));
}

/* ===================== naming conventions ===================== */
function slugify(s){
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'')   // strip accents
    .replace(/['‘’]/g,'')                          // drop apostrophes
    .replace(/&/g,' and ').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
const TAKE_WORDS = [null,null,'Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
function planUpload(filename){
  let base = filename.replace(/\.mp3$/i,'').trim();
  let take = 1;
  const m = base.match(/^(.*?)\s*\((\d+)\)$/);              // Suno's "(1)" duplicates
  if (m){ base = m[1].trim(); take = parseInt(m[2], 10) + 1; }
  // bump past takes already in the library under this base title
  const taken = new Set();
  for (const pl of model) for (const t of pl.tracks){
    if (t.title === base) taken.add(1);
    const tm = t.title.match(new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ' \\(Take (\\w+)\\)$'));
    if (tm){ const n = TAKE_WORDS.indexOf(tm[1]); if (n > 0) taken.add(n); }
  }
  while (taken.has(take)) take++;
  const title = take === 1 ? base : `${base} (Take ${TAKE_WORDS[take] || take})`;
  const slug = take === 1 ? slugify(base) : `${slugify(base)}-take-${(TAKE_WORDS[take] || take).toString().toLowerCase()}`;
  return { title, key: slug + '.mp3' };
}

/* ===================== views ===================== */
function render(html){ $id('view').innerHTML = html; }
function modal(html){ $id('modalHost').innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ $id('modalHost').innerHTML = ''; }

function viewSetup(){
  render(`
    <div class="panel">
      <h2>First-time setup</h2>
      <p>Paste the two tokens, choose a passphrase, and they'll be stored on
         this device only — encrypted with the passphrase, which is asked for
         every time the screen opens.</p>
      <label>GitHub token (fine-grained, this repo only)</label>
      <input type="password" id="ghTok" autocomplete="off">
      <label>R2 access key ID</label>
      <input type="text" id="r2Id" autocomplete="off">
      <label>R2 secret access key</label>
      <input type="password" id="r2Sec" autocomplete="off">
      <label>Choose a passphrase</label>
      <input type="password" id="pass1" autocomplete="new-password">
      <label>Repeat the passphrase</label>
      <input type="password" id="pass2" autocomplete="new-password">
      <div class="btn-row"><button class="btn" onclick="doSetup()">Save &amp; open</button></div>
      <div class="error" id="err"></div>
    </div>`);
}
async function doSetup(){
  const gh = $id('ghTok').value.trim(), r2id = $id('r2Id').value.trim(), r2secret = $id('r2Sec').value.trim();
  const p1 = $id('pass1').value, p2 = $id('pass2').value;
  if (!gh || !r2id || !r2secret){ $id('err').textContent = 'All three credentials are needed.'; return; }
  if (p1.length < 6){ $id('err').textContent = 'Passphrase needs at least 6 characters.'; return; }
  if (p1 !== p2){ $id('err').textContent = 'Passphrases do not match.'; return; }
  await sealVault(p1, { gh, r2id, r2secret });
  creds = { gh, r2id, r2secret };
  openConsole();
}

function viewUnlock(){
  render(`
    <div class="panel">
      <h2>Unlock</h2>
      <p>Enter the admin passphrase for this device.</p>
      <label>Passphrase</label>
      <input type="password" id="pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doUnlock()">
      <div class="btn-row">
        <button class="btn" onclick="doUnlock()">Unlock</button>
        <button class="btn ghost" onclick="if(confirm('Forget the stored tokens on this device? You will need to set up again.')){localStorage.removeItem(VAULT_KEY);viewSetup()}">Reset</button>
      </div>
      <div class="error" id="err"></div>
    </div>`);
  $id('pass').focus();
}
async function doUnlock(){
  try { creds = await openVault($id('pass').value); openConsole(); }
  catch { $id('err').textContent = 'Wrong passphrase.'; }
}

async function openConsole(){
  render('<div class="panel"><p>Loading the library…</p></div>');
  try { model = parsePlaylists(await ghLoad()); dirty = 0; viewConsole(); }
  catch (e){ render(`<div class="panel"><p>Could not load the library: ${esc(e.message)}</p><div class="btn-row"><button class="btn" onclick="openConsole()">Retry</button></div></div>`); }
}

function viewConsole(){
  let h = '';
  model.forEach((pl, pi) => {
    let rows = '';
    pl.tracks.forEach((t, ti) => {
      if (ti === 0 && pl.altBoundary > 0) rows += '<div class="section-note">Songs</div>';
      if (ti === pl.altBoundary) rows += '<div class="section-note">Takes &amp; remixes</div>';
      rows += `<div class="song"><span class="t">${esc(t.title)}</span>
        <button onclick="askMove(${pi},${ti})">Move</button>
        <button onclick="askRename(${pi},${ti})">Rename</button>
        <button onclick="askRemove(${pi},${ti})" title="Remove from playlist">✕</button></div>`;
    });
    h += `<details class="pl"${model.length <= 5 && pi === 0 ? ' open' : ''}>
      <summary><span class="pl-name">${esc(pl.name)}</span>
        <span class="pl-count">${pl.tracks.length} tracks</span>
        <button class="btn small ghost" onclick="event.preventDefault();askUpload(${pi})">Add songs</button>
      </summary>${rows}</details>`;
  });
  h += `<div class="savebar">
    <span class="count" id="dirtyCount"></span>
    <button class="btn" id="saveBtn" onclick="doSave()"></button>
    <button class="btn ghost" onclick="if(dirty===0||confirm('Discard the pending changes?'))openConsole()">Reload</button>
    <button class="btn ghost" onclick="creds=null;model=null;viewUnlock()">Lock</button>
  </div>`;
  render(h);
  paintDirty();
}
function paintDirty(){
  $id('dirtyCount').textContent = dirty === 0 ? 'No pending changes' : dirty + ' pending change' + (dirty === 1 ? '' : 's');
  $id('saveBtn').disabled = dirty === 0;
  $id('saveBtn').textContent = 'Save';
}

/* ===================== actions ===================== */
function askMove(pi, ti){
  const t = model[pi].tracks[ti];
  let h = `<h3>Move “${esc(t.title)}”</h3>`;
  model.forEach((pl, i) => { if (i !== pi) h += `<button class="choice" onclick="doMove(${pi},${ti},${i})">${esc(pl.name)}</button>`; });
  h += '<div class="btn-row"><button class="btn ghost" onclick="closeModal()">Cancel</button></div>';
  modal(h);
}
function doMove(pi, ti, target){
  const src = model[pi], dst = model[target];
  const [t] = src.tracks.splice(ti, 1);
  if (ti < src.altBoundary) src.altBoundary--;
  if (isAlternate(t.title)) dst.tracks.push(t);
  else dst.tracks.splice(dst.altBoundary++, 0, t);
  dirty++; closeModal(); viewConsole();
}
function askRename(pi, ti){
  const t = model[pi].tracks[ti];
  const name = prompt('New title for this song:', t.title);
  if (name && name.trim() && name.trim() !== t.title){
    t.title = name.trim().replace(/"/g, "'");
    dirty++; viewConsole();
  }
}
function askRemove(pi, ti){
  const t = model[pi].tracks[ti];
  if (!confirm(`Remove “${t.title}” from ${model[pi].name}? (The MP3 stays safe in storage.)`)) return;
  const src = model[pi];
  src.tracks.splice(ti, 1);
  if (ti < src.altBoundary) src.altBoundary--;
  dirty++; viewConsole();
}

async function doSave(){
  $id('saveBtn').disabled = true; $id('saveBtn').textContent = 'Saving…';
  try {
    await ghSave(`Admin: update playlists (${dirty} change${dirty === 1 ? '' : 's'} via the admin screen)`);
    dirty = 0; paintDirty();
    $id('dirtyCount').textContent = 'Saved — live in a couple of minutes, salons overnight';
  } catch (e){
    if (e.message === 'conflict'){
      alert('The playlists changed somewhere else while you were editing. Reloading the latest version — your pending changes were not saved.');
      openConsole();
    } else { alert('Save failed: ' + e.message); paintDirty(); }
  }
}

/* ===================== uploads ===================== */
function askUpload(pi){
  modal(`<h3>Add songs to ${esc(model[pi].name)}</h3>
    <p style="font-size:14px;color:var(--ink-soft)">Pick the MP3s straight from Suno's download — duplicate "(1)" names
    become numbered takes automatically.</p>
    <input type="file" id="uplFiles" accept=".mp3,audio/mpeg" multiple style="margin:12px 0">
    <div id="uplList"></div>
    <div class="btn-row">
      <button class="btn" id="uplGo" onclick="doUpload(${pi})">Upload</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
}
async function doUpload(pi){
  const files = [...$id('uplFiles').files];
  if (!files.length) return;
  $id('uplGo').disabled = true;
  const listEl = $id('uplList');
  listEl.innerHTML = '';
  const rows = files.map(f => {
    const plan = planUpload(f.name);
    const el = document.createElement('div');
    el.className = 'upl-row';
    el.innerHTML = `<span class="name">${esc(plan.title)}</span><progress max="1" value="0"></progress><span class="st">waiting</span>`;
    listEl.appendChild(el);
    return { f, plan, el };
  });
  let ok = 0;
  for (const r of rows){
    const st = r.el.querySelector('.st'), bar = r.el.querySelector('progress');
    try {
      st.textContent = 'checking';
      if (await r2Exists(r.plan.key)){
        st.textContent = 'already in storage — added to playlist';
      } else {
        st.textContent = 'hashing';
        const buf = await r.f.arrayBuffer();
        const hash = await sha256hex(buf);
        st.textContent = 'uploading';
        await r2Upload(r.plan.key, r.f, hash, p => bar.value = p);
        bar.value = 1;
        st.textContent = 'uploaded';
      }
      const t = { title: r.plan.title, artist: ARTIST, url: AUDIO_BASE + r.plan.key };
      const dst = model[pi];
      if (isAlternate(t.title)) dst.tracks.push(t);
      else dst.tracks.splice(dst.altBoundary++, 0, t);
      dirty++; ok++;
    } catch (e){
      st.textContent = 'failed: ' + e.message;
    }
  }
  $id('uplGo').disabled = false;
  $id('uplGo').textContent = 'Upload more';
  if (ok){
    const note = document.createElement('p');
    note.style.cssText = 'font-size:14px;color:var(--sage-deep);margin-top:10px';
    note.textContent = ok + ' song' + (ok === 1 ? '' : 's') + ' staged — close this and press Save to publish.';
    listEl.appendChild(note);
  }
}

/* ===================== self-test hook (used during development) ===================== */
window.__selfTest = async function(){
  const text = await (await fetch('playlists.js?t=' + Date.now())).text();
  model = parsePlaylists(text);
  const before = model.map(p => ({ n:p.name, c:p.tracks.length, b:p.altBoundary }));
  const regen = regenerate();
  const reparsed = parsePlaylists(regen);
  const after = reparsed.map(p => ({ n:p.name, c:p.tracks.length, b:p.altBoundary }));
  const salonPattern = /title:\s*"([^"]+)".*artist:\s*"([^"]+)".*url:\s*"([^"]+)"/;
  const lineCheck = regen.split('\n').filter(l => l.includes('title:')).every(l => salonPattern.test(l));
  return { roundtripEqual: JSON.stringify(before) === JSON.stringify(after), before, after,
           salonParserCompatible: lineCheck,
           headerPreserved: regen.startsWith(headerText),
           slugTests: [slugify("Kettle’s On"), slugify('Mano Extraña'), slugify('R&B Nights')],
           planTests: [planUpload('Velvet Dusk.mp3'), planUpload('Velvet Dusk (1).mp3'), planUpload('Sunlit Table for Two.mp3')] };
};

/* ===================== boot ===================== */
if (localStorage.getItem(VAULT_KEY)) viewUnlock(); else viewSetup();
</script>
