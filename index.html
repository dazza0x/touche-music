<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touché Music">
<meta name="theme-color" content="#f6f1e8">
<title>Touché — Salon Soundtrack</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<header>
  <div class="wordmark">Touché</div>
  <div class="strap">Salon Soundtrack</div>
</header>

<nav class="playlists" id="playlistNav" aria-label="Playlists"></nav>

<main>
  <section class="now" id="nowPlaying">
    <div class="playlist-label" id="npPlaylist">—</div>
    <h1 id="npTitle">Choose a playlist</h1>
    <div class="artist" id="npArtist">Tap play and the music looks after itself</div>
    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </section>

  <section class="tracks" id="trackList" aria-label="Track list"></section>
</main>

<div class="bar">
  <div class="progress">
    <span id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek">
    <span id="tEnd">0:00</span>
    <div class="volume" id="volWrap">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="#6f675c" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
    </div>
  </div>
  <div class="controls">
    <button class="ctl toggle" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
      <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      <span class="dot"></span>
    </button>
    <button class="ctl" id="prevBtn" aria-label="Previous track">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctl play" id="playBtn" aria-label="Play">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctl" id="nextBtn" aria-label="Next track">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="ctl toggle on" id="loopBtn" aria-label="Repeat playlist" title="Repeat playlist">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      <span class="dot"></span>
    </button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="playlists.js"></script>
<script src="player.js?v=2"></script>
</body>
</html>
